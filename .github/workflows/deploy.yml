# Check the site, then deploy it to Cloudflare Pages (project myprivatenetwork).
# Push to main -> production (myprivate.network).
# Pull request  -> preview deploy on <branch>.myprivatenetwork.pages.dev; the URL
#                  is in the run summary. PRs from forks only run the check.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check links, titles and CSP
        run: node scripts/check.mjs

      - name: Deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          set -o pipefail
          npx wrangler pages deploy public --project-name=myprivatenetwork \
            --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          test -n "$url"
          echo "Deployed \`$BRANCH\` to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production
        if: github.event_name != 'pull_request'
        run: |
          sleep 10
          for p in / /blog/ /security.txt /pgp.asc; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://myprivate.network$p")
            echo "$p $code"
            test "$code" = 200
          done
